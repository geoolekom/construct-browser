name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  pre-commit:
    name: formatters (pre-commit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cfs-validate:
    name: cfs validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install cfs (Constructor Studio)
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('.cf-studio/version.toml', 'rb'))['cfs']['version'])")
          archive="$RUNNER_TEMP/studio.tar.gz"
          source="$RUNNER_TEMP/studio-source"
          upstream=https://codeload.github.com/constructorfabric/studio/tar.gz
          if [[ "$version" == v1.6.2 ]]; then
            revision=e3a283fd2d5c45942e9192161458c1c71c938493
            checksum=93243cd578899c53f1b3270290304d276e0365bdeaa6249fbe33e8a2101a3619
            # The public mirror carries the same checksummed upstream commit.
            curl -fsSL "$upstream/$revision" -o "$archive" ||
              curl -fsSL "https://codeload.github.com/efomenko/studio/tar.gz/$revision" -o "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          else
            curl -fsSL "$upstream/refs/tags/$version" -o "$archive"
          fi
          mkdir -p "$source"
          tar -xzf "$archive" --strip-components=1 -C "$source"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CONSTRUCTOR_STUDIO="${version#v}" python -m pip install "$source"
          printf '%s\n' "$version" > "$source/.version"
          printf 'CFS_CACHE_DIR=%s\n' "$source" >> "$GITHUB_ENV"
      - name: Validate artifacts + traceability
        env:
          CFS_NO_VERSION_CHECK: '1'
        run: cfs validate --local-only --verbose

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &protobuf-packages
        name: Install protobuf packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libprotobuf-dev
      # Ubuntu 22.04's protoc requires an experimental flag for proto3 optional fields.
      - &protobuf-compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        if: runner.os != 'Windows'
        with:
          version: '25.8'
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Lint
        # The bundled PostgreSQL build queries the GitHub releases API.
        env: &postgresql-download
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Use a short temporary directory for macOS test sockets
        if: runner.os == 'macOS'
        run: |
          test_dir=$(mktemp -d /tmp/construct.XXXXXX)
          printf 'TMPDIR=%s\n' "$test_dir" >> "$GITHUB_ENV"
      - name: Test
        env: *postgresql-download
        run: cargo test --locked

  app:
    name: App
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint:ts
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  agent-binary:
    name: Release agent binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *protobuf-packages
      - *protobuf-compiler
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the release agent
        env: *postgresql-download
        run: cargo build --release --locked -p construct-agent --bin construct-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: construct-agent
          path: target/release/construct-agent
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Electron end-to-end tests
    runs-on: ubuntu-22.04
    # Bundled PostgreSQL needs glibc 2.36, which Bookworm provides.
    container: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    needs: agent-binary
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: construct-agent
          path: target/release
      - name: Install Electron system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libasound2 libgbm1 libgtk-3-0 libnss3 libxss1 xauth xvfb
      - name: Install and package the app
        run: |
          chmod +x ../target/release/construct-agent
          npm ci
          node node_modules/electron/install.js
          npm run package
      - name: Install FFmpeg for Playwright recordings
        run: runuser -u node -- npm exec -- playwright install ffmpeg
      - name: Test the app under a virtual display
        # The Playwright fixtures launch Electron with --no-sandbox.
        # PostgreSQL needs an unprivileged user, and Playwright recreates test-results.
        run: |
          chown node:node .
          runuser -u node -- xvfb-run -a npm exec -- playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: electron-test-results
          path: app/test-results/
          retention-days: 7
