name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./app/package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version ($version)"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="snapshot-${GITHUB_SHA:0:7}"
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            artifact: linux-x64-deb
            path: app/out/make/deb/x64/*.deb
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64-dmg
            path: app/out/make/dmg/arm64/*.dmg
          - platform: windows-x64
            runner: windows-2022
            artifact: windows-x64-setup
            path: app/out/make/squirrel.windows/x64/construct-browser-x64-Setup.exe
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot protobuf-compiler libprotobuf-dev
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        if: runner.os == 'Linux'
        with:
          version: '25.8'
          repo-token: ${{ github.token }}
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc --print host-tuple)" = "$RUST_TARGET"
          brew install protobuf
          # Seed the bundled PostgreSQL cache without querying GitHub's releases API.
          scripts/build-pgvector.sh --download-postgresql "$HOME/.theseus/postgresql" "$RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the release agent
        run: cargo build --release --locked -p construct-agent --bin construct-agent
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        if: runner.os != 'Windows'
        run: make app-deps
      - name: Install Windows app dependencies
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Package the app
        working-directory: app
        run: npm run make
      - name: Test the Windows agent path
        if: runner.os == 'Windows'
        working-directory: app
        run: npm exec -- vitest run unit/agent-service.test.ts
      - name: Verify the Windows installer
        if: runner.os == 'Windows'
        env:
          INSTALLER: ${{ matrix.path }}
        run: |
          if [[ ! -s "$INSTALLER" ]]; then
            echo "::error::Squirrel did not create $INSTALLER"
            exit 1
          fi
      - name: Verify the macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app='app/out/Construct Browser-darwin-arm64/Construct Browser.app'
          codesign --verify --deep --strict "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature"
          if ! grep -Fxq 'Signature=adhoc' <<< "$signature" ||
             grep -Fq '(runtime)' <<< "$signature"; then
            echo '::error::Expected an ad hoc signature without the hardened runtime'
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64-deb
          path: dist
      - name: Install the Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth "$PWD"/dist/*.deb
      - name: Check the installed agent and app
        run: scripts/smoke-linux.sh

  publish:
    if: >-
      github.repository == 'constructorfabric/construct' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag'))
    needs: [version, build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '*-deb'
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-setup
          path: dist
      - name: Publish the packages and checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          packages=(*.deb *.exe)
          sha256sum -- "${packages[@]}" > SHA256SUMS
          if release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets); then
            draft=$(jq -r '.isDraft' <<< "$release")
            if [[ "$draft" == true ]]; then
              echo "::error::Release $TAG is a draft. Add any missing packages and SHA256SUMS. Verify the packages against SHA256SUMS before publishing."
              exit 1
            fi
            existing=$(jq -r '.assets[].name' <<< "$release")
            # Keep checksums immutable for consumers that pin them.
            for file in "${packages[@]}"; do
              if ! grep -Fxq -- "$file" <<< "$existing"; then
                gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$file"
                echo "::warning::$TAG lacked $file; the existing SHA256SUMS was left as published"
              fi
            done
            exit 0
          fi

          flags=(--repo "$GITHUB_REPOSITORY" --title "Construct Browser $VERSION" --target "$GITHUB_SHA")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --notes "Snapshot build from $GITHUB_SHA.")
          else
            flags+=(--latest --verify-tag --generate-notes)
          fi
          gh release create "$TAG" "${flags[@]}" "${packages[@]}" SHA256SUMS
