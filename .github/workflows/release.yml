name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./app/package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version ($version)"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="snapshot-${GITHUB_SHA:0:7}"
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    needs: version
    name: Build (linux-x64)
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot protobuf-compiler libprotobuf-dev
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.8'
          repo-token: ${{ github.token }}
      - &rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - &build-agent
        name: Build the release agent
        run: cargo build --release --locked -p construct-agent --bin construct-agent
      - &setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: make app-deps
      - &package-app
        name: Package the app
        working-directory: app
        run: npm run make
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-deb
          path: app/out/make/deb/x64/*.deb
          if-no-files-found: error

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64-dmg
            path: app/out/make/dmg/arm64/*.dmg
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - *checkout
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc --print host-tuple)" = "$RUST_TARGET"
          brew install protobuf
          # Seed the bundled PostgreSQL cache without querying GitHub's releases API.
          scripts/build-pgvector.sh --download-postgresql "$HOME/.theseus/postgresql" "$RUST_TARGET"
      - *rust-cache
      - *build-agent
      - *setup-node
      - name: Install app dependencies
        if: runner.os == 'macOS'
        run: make app-deps
      - *package-app
      - name: Verify the macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app='app/out/Construct Browser-darwin-arm64/Construct Browser.app'
          codesign --verify --deep --strict "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature"
          if ! grep -Fxq 'Signature=adhoc' <<< "$signature" ||
             grep -Eq '^CodeDirectory .* flags=0x[[:xdigit:]]+\(([^,()]+,)*runtime[,)]' <<< "$signature"; then
            echo '::error::Expected an ad hoc signature without the hardened runtime'
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  build-windows:
    needs: version
    name: Build (windows-x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    outputs:
      installer-url: ${{ steps.installer.outputs.artifact-url }}
    env:
      CARGO_INCREMENTAL: '0'
      INSTALLER: app/out/make/squirrel.windows/x64/construct-browser-x64-Setup.exe
    steps:
      - *checkout
      - *rust-cache
      - *build-agent
      - *setup-node
      - name: Install Windows app dependencies
        run: bash scripts/install-app-deps.sh
      - *package-app
      - name: Test the Windows agent path
        working-directory: app
        run: npm exec -- vitest run unit/agent-service.test.ts
      - name: Verify the unsigned Windows installer
        run: |
          if [[ ! -s "$INSTALLER" ]]; then
            echo "::error::Squirrel did not create $INSTALLER"
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '
            $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER
            if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned installer, got $($signature.Status)"
            }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: installer
        with:
          name: windows-x64-setup
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

  smoke:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64-deb
          path: dist
      - name: Install the Debian package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth "$PWD"/dist/*.deb
      - name: Check the installed agent and app
        run: scripts/smoke-linux.sh

  publish:
    if: >-
      contains(fromJSON(vars.RELEASE_REPOSITORIES || '["constructorfabric/construct"]'), github.repository) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag')) &&
      !cancelled() && needs.version.result == 'success' &&
      needs.build-linux.result == 'success' && needs.build.result == 'success' &&
      needs.smoke.result == 'success'
    needs: [version, build-linux, build, smoke, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '*-{deb,dmg}'
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-windows
        if: needs.build-windows.result == 'success'
        continue-on-error: true
        with:
          name: windows-x64-setup
          path: dist
      - name: Publish the package and checksums
        shell: bash
        working-directory: dist
        env:
          WINDOWS_ARTIFACT_URL: ${{ needs.build-windows.outputs.installer-url }}
          WINDOWS_DOWNLOAD_OUTCOME: ${{ steps.download-windows.outcome }}
        run: |
          set -euo pipefail
          installer=construct-browser-x64-Setup.exe
          packages=(*.deb *.dmg)
          windows_available=false
          for file in "${packages[@]}"; do
            test -s "$file"
          done

          report_installer() {
            printf '::warning::%s\n' "$1"
            if [[ -n "$WINDOWS_ARTIFACT_URL" ]]; then
              printf '%s [Verified Windows installer](%s).\n' "$1" "$WINDOWS_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          installer_uploaded() {
            jq -e --arg name "$installer" \
              'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<< "$1" > /dev/null
          }

          if [[ "$WINDOWS_DOWNLOAD_OUTCOME" == success && -s "$installer" ]]; then
            windows_available=true
          elif [[ -n "$WINDOWS_ARTIFACT_URL" ]]; then
            report_installer 'The Windows artifact could not be included. Linux publication can continue.'
          fi
          if release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,assets); then
            draft=$(jq -r '.isDraft' <<< "$release")
            if [[ "$draft" == true ]]; then
              echo "::error::Release $TAG is a draft. Add any missing packages and SHA256SUMS. Verify the packages against SHA256SUMS before publishing."
              exit 1
            fi
            existing=$(jq -r '.assets[].name' <<< "$release")
            immutable=$(jq -r '.isImmutable' <<< "$release")
            if [[ "$immutable" == true ]] && ! installer_uploaded "$release"; then
              report_installer "Immutable release $TAG has no complete Windows installer. The next release can include it."
            fi

            # Keep checksums immutable for consumers that pin them.
            for file in "${packages[@]}"; do
              if ! grep -Fxq -- "$file" <<< "$existing"; then
                if [[ "$immutable" == true ]]; then
                  echo "::error::Immutable release $TAG is missing $file"
                  exit 1
                fi
                gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$file"
                echo "::warning::$TAG lacked $file; the existing SHA256SUMS was left as published"
              fi
            done

            if [[ "$immutable" == false && "$windows_available" == true ]] && ! installer_uploaded "$release"; then
              if grep -Fxq -- "$installer" <<< "$existing"; then
                report_installer "Release $TAG has an incomplete Windows asset. Remove that asset before retrying."
                exit 1
              fi
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$installer"
              echo "::warning::$TAG lacked $installer; the existing SHA256SUMS was left as published"
            fi
            exit 0
          fi

          flags=(--repo "$GITHUB_REPOSITORY" --title "Construct Browser $VERSION" --target "$GITHUB_SHA")
          publish_flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --notes "Snapshot build from $GITHUB_SHA.")
          else
            flags+=(--verify-tag --generate-notes)
            publish_flags+=(--latest)
          fi
          gh release create "$TAG" "${flags[@]}" --draft "${packages[@]}"

          if [[ "$windows_available" == true ]]; then
            if ! gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$installer"; then
              echo "::warning::Windows installer upload failed. Checking the draft assets."
            fi
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,assets)
            if ! jq -e '.isDraft == true' <<< "$draft" > /dev/null; then
              echo "::error::Release $TAG was published before its checksums were attached"
              exit 1
            fi
            if installer_uploaded "$draft"; then
              packages+=("$installer")
            else
              if jq -e --arg name "$installer" 'any(.assets[]; .name == $name)' <<< "$draft" > /dev/null; then
                if ! gh release delete-asset "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --yes; then
                  draft_id=$(jq -er '.databaseId | select(type == "number" and . > 0)' <<< "$draft")
                  draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,assets)
                  if ! jq -e --argjson id "$draft_id" --arg name "$installer" \
                    '.databaseId == $id and .isDraft == true and all(.assets[]; .name != $name)' <<< "$draft" > /dev/null; then
                    report_installer "Could not confirm removal of the incomplete Windows asset from draft $TAG."
                    exit 1
                  fi
                fi
              fi
              report_installer "The verified Windows installer could not be attached to $TAG. The next release can include it."
            fi
          fi

          sha256sum -- "${packages[@]}" > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${publish_flags[@]}"
